[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "furui"
version = "0.1.0"
description = "Curated long-term memory for AI agents over MCP: decay, reinforcement and pruning. Memory that knows what to forget."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "furui contributors" }]
keywords = ["mcp", "memory", "llm", "agents", "sqlite", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["fastmcp>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
furui = "furui.server:main"

[tool.hatch.build.targets.wheel]
packages = ["furui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
